
# ==================================================
# Security Audit and Hardening Automation Suite
# Security Policy Configuration
# ==================================================

# -------------------------------
# General Settings
# -------------------------------

DEFAULT_PROFILE=full
AUTO_REMEDIATE=false
BACKUP_ENABLED=true

# -------------------------------
# Password Security Policy
# -------------------------------

PASS_MIN_LEN=12
PASS_MAX_DAYS=90
PASS_MIN_DAYS=7
PASS_WARN_AGE=14

# -------------------------------
# SSH Security Policy
# -------------------------------

PERMIT_ROOT_LOGIN=no
PASSWORD_AUTHENTICATION=no

# -------------------------------
# Network Security Policy
# -------------------------------

ALLOWED_PORTS="22,80,443"

# -------------------------------
# File Permission Policy
# -------------------------------

PASSWD_PERMISSION=644
SHADOW_PERMISSION=640
GROUP_PERMISSION=644

WORLD_WRITABLE_SCAN_PATHS="/etc /home /var/www"
MAX_WORLD_WRITABLE_RESULTS=100

# -------------------------------
# Firewall Policy
# -------------------------------

FIREWALL_REQUIRED=true

# -------------------------------
# System Update Policy
# -------------------------------

CHECK_UPDATES=true
MAX_PENDING_UPDATES=10

# -------------------------------
# Unnecessary Services
# -------------------------------

UNNECESSARY_SERVICES="telnet vsftpd rsh rexec"

# -------------------------------
# Scan Profiles
# -------------------------------

PROFILE_QUICK="ssh password network"
PROFILE_FULL="ssh password network permissions accounts firewall updates services"
PROFILE_NETWORK="ssh network firewall services"
PROFILE_FILESYSTEM="permissions accounts"
PROFILE_CUSTOM=""

# -------------------------------
# Remediation Policy
# -------------------------------

FIX_ROOT_SSH=true
FIX_FILE_PERMISSIONS=true
FIX_PASSWORD_POLICY=true
FIX_WORLD_WRITABLE=false
FIX_FIREWALL=false
FIX_SERVICES=false
FIX_UPDATES=false
